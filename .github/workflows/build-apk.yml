name: Build APK
on:
  workflow_call:
    inputs:
      gradle-task:
        description: "Gradle assemble task to run"
        required: true
        type: string
      ref:
        description: "Git ref to check out (empty = caller's ref)"
        required: false
        type: string
      retention-days:
        description: "Retention of the APKs artifact in days (release uses the default; preview has no publish job so the artifact is the only product)"
        required: false
        type: number
        default: 1
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: Download LibCore
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: libcore-aar
          path: app/libs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Plugin cores cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: app/executableSo
          key: plugins-${{ hashFiles('buildScript/lib/plugins.sh') }}
      - name: Install SDK 36
        # Lives here rather than in buildScript/ so it stays off the F-Droid prebuild path.
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-36" "build-tools;36.0.0" > /dev/null
          fi
      - name: Gradle Build
        env:
          # assets.sh resolves the latest geoip/geosite release via the GitHub API;
          # unauthenticated calls from shared runner IPs hit the 60/h rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          # only point ndk.dir at NDK 25 when it is actually installed; the app has
          # no externalNativeBuild, and a dangling path just spams CXX1102 warnings
          if [ -d "${ANDROID_HOME}/ndk/25.0.8775105" ]; then
            echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew ${{ inputs.gradle-task }}
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::no arm64-v8a APK found under app/build/outputs/apk; aborting upload (an empty path would upload the whole workspace, including release.keystore and local.properties)"
            exit 1
          fi
          echo "APK=$(dirname "$APK")" >> $GITHUB_ENV
      - name: Verify APK signature
        # Release builds (oss AND preview — signing is buildType-level in Helpers.kt) must be
        # signed. Helpers.kt only wires the signing config when KEYSTORE_PASS exists, so a
        # missing KEYSTORE_BASE64/LOCAL_PROPERTIES secret silently produces unsigned APKs
        # (an empty decoded keystore file fails the same way). Fail loudly before upload.
        run: |
          FAILED=0
          while IFS= read -r apk; do
            if ! "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"; then
              echo "::error::$apk is unsigned or failed signature verification"
              FAILED=1
            fi
          done < <(find app/build/outputs/apk -name '*.apk')
          exit $FAILED
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: APKs
          path: ${{ env.APK }}
          # release: hand-off for the publish job only; published APKs live as release assets
          # preview: no publish job — the artifact IS the product, so preview.yml passes 7
          retention-days: ${{ inputs.retention-days }}
